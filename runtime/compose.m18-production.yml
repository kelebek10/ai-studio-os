services:
  m18-runtime-gateway:
    build:
      context: ..
      dockerfile: runtime/Dockerfile.m18-production
    container_name: m18-runtime-gateway
    restart: unless-stopped
    environment:
      M18_DATABASE_DSN: ${M18_DATABASE_DSN}
      M18_AGENT_ID: ${M18_AGENT_ID}
      M18_SOURCE_COMMIT: ${M18_SOURCE_COMMIT}
      M18_MODEL: ${M18_MODEL:-qwen3:1.7b}
      M18_OLLAMA_URL: ${M18_OLLAMA_URL:-http://ollama:11434}
      M18_PORT: 8091
    networks:
      - peyzaj_production_peyzaj_net
      - ollama_default
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8091/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s
    read_only: true
    tmpfs:
      - /tmp

networks:
  peyzaj_production_peyzaj_net:
    external: true
  ollama_default:
    external: true

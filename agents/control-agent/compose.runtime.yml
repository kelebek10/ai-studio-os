services:
  control-agent:
    image: ${CONTROL_AGENT_IMAGE:?CONTROL_AGENT_IMAGE is required}
    container_name: paiforge-control-agent
    restart: unless-stopped
    init: true
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    environment:
      PG_HOST: peyzaj_postgres
      PG_PORT: ${PG_PORT:-5432}
      PG_DB: ${POSTGRES_DB:?POSTGRES_DB is required}
      PG_USER: ${RUNNER_DB_USER:?RUNNER_DB_USER is required}
      PG_PASSWORD: ${RUNNER_DB_PASSWORD:?RUNNER_DB_PASSWORD is required}
    networks:
      - peyzaj_net

networks:
  peyzaj_net:
    external: true
    name: peyzaj_production_peyzaj_net
